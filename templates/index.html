<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Sign Config</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        input { margin-bottom: 10px; width: 100%; padding: 5px; }
        label { font-weight: bold; }
        .section { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>Subway Sign Configuration</h1>
    <form method="POST">
        
        <div class="section">
            <h2>WiFi Settings</h2>
            <label for="ssid">SSID:</label>
            <input type="text" id="ssid" name="ssid" value="{{ config.wifi.ssid }}"><br>
        </div>

        <div class="section">
            <h2>Display Settings</h2>
            <label>Brightness (0-100):</label>
            <input type="number" name="brightness" min="0" max="100" value="{{ config.display.brightness }}"><br>

            <label>MTA Directions:</label>
            <input type="text" name="mta_directions" value="{{ config.display.mta_directions }}"><br>

            <label>Refresh Time Delay (sec):</label>
            <input type="number" name="refresh_time_delay" value="{{ config.display.refresh_time_delay }}"><br>

            <label>Rotate Trip Delay (sec):</label>
            <input type="number" name="rotate_trip_delay" value="{{ config.display.rotate_trip_delay }}"><br>

            <label>Screen Refresh Interval (sec):</label>
            <input type="number" name="screen_refresh_interval" value="{{ config.display.screen_refresh_interval }}"><br>

            <label>Minimum Arrival Minutes:</label>
            <input type="number" name="minimum_arrival_minutes" value="{{ config.display.minimum_arrival_minutes }}"><br>

            <label>Maximum Arrival Minutes:</label>
            <input type="number" name="maximum_arrival_minutes" value="{{ config.display.maximum_arrival_minutes }}"><br>

            <label>LED Rows:</label>
            <input type="number" name="led_rows" value="{{ config.display.led_rows }}"><br>

            <label>LED Columns:</label>
            <input type="number" name="led_columns" value="{{ config.display.led_columns }}"><br>

            <label>LED Chain Length:</label>
            <input type="number" name="led_chain_length" value="{{ config.display.led_chain_length }}"><br>

            <label>LED Parallel:</label>
            <input type="number" name="led_parallel" value="{{ config.display.led_parallel }}"><br>

            <label>LED Hardware Mapping:</label>
            <input type="text" name="led_hardware_mapping" value="{{ config.display.led_hardware_mapping }}"><br>

            <label>Line Direction Max Length:</label>
            <input type="number" name="line_direction_max_length" value="{{ config.display.line_direction_max_length }}"><br>
        </div>

        <div class="section">
            <h2>Feed Settings</h2>
            <label>MTA Routes:</label>
            <input type="text" name="mta_routes" value="{{ config.feed.mta_routes }}"><br>

            <label>MTA Stop:</label>
            <input type="text" name="mta_stop" value="{{ config.feed.mta_stop }}"><br>

            <label>MTA Feed Base URL:</label>
            <input type="text" name="mta_feed_base_url" value="{{ config.feed.mta_feed_base_url }}"><br>
        </div>

        <input type="submit" value="Save Settings">
        <div class="section">
            <h2>Reset to Factory Settings</h2>
            <button id="reset-button" style="background: red; color: white; padding: 10px; border: none;">
                Reset to Defaults
            </button>
        </div>
    </form>
</body>
<script>
    document.querySelector("form").onsubmit = function(event) {
        event.preventDefault(); 
        fetch("/", {
            method: "POST",
            body: new FormData(document.querySelector("form"))
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message); 
            setTimeout(() => {
                location.reload(); 
            }, 3000);
        });
    };
</script>
<script>
    document.getElementById("reset-button").onclick = function() {
        if (confirm("Are you sure? This will reset all settings to factory defaults.")) {
            fetch("/reset", { method: "POST" })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                setTimeout(() => {
                    location.reload();
                }, 3000);
            });
        }
    };
</script>
</html>
