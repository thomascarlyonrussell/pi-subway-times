<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Sign Config</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        input, select { margin-bottom: 10px; width: 100%; padding: 5px; }
        label { font-weight: bold; }
        .section { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; }
        .helper { color: #666; font-size: 0.9em; margin-top: -5px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Subway Sign Configuration</h1>
    <div class="section">
        <h2>Setup Authentication</h2>
        <label for="setup-pin">Setup PIN:</label>
        <input type="password" id="setup-pin" placeholder="Enter setup PIN">
        <button type="button" id="auth-button">Authenticate</button>
    </div>
    <form method="POST">
        
        <div class="section">
            <h2>WiFi Settings</h2>
            <label for="ssid">SSID:</label>
            <input type="text" id="ssid" name="ssid" value="{{ config.wifi.ssid }}"><br>
            <label for="password">WiFi Password:</label>
            <input type="password" id="password" name="password" value=""><br>
        </div>

        <div class="section">
            <h2>Display Settings</h2>
            <label>Brightness (0-100):</label>
            <input type="number" name="brightness" min="0" max="100" value="{{ config.display.brightness }}"><br>

            <label>MTA Directions:</label>
            <input type="text" name="mta_directions" value="{{ config.display.mta_directions }}"><br>

            <label>Refresh Time Delay (sec):</label>
            <input type="number" name="refresh_time_delay" value="{{ config.display.refresh_time_delay }}"><br>

            <label>Rotate Trip Delay (sec):</label>
            <input type="number" name="rotate_trip_delay" value="{{ config.display.rotate_trip_delay }}"><br>

            <label>Screen Refresh Interval (sec):</label>
            <input type="number" name="screen_refresh_interval" value="{{ config.display.screen_refresh_interval }}"><br>

            <label>Minimum Arrival Minutes:</label>
            <input type="number" name="minimum_arrival_minutes" value="{{ config.display.minimum_arrival_minutes }}"><br>

            <label>Maximum Arrival Minutes:</label>
            <input type="number" name="maximum_arrival_minutes" value="{{ config.display.maximum_arrival_minutes }}"><br>

            <label>LED Rows:</label>
            <input type="number" name="led_rows" value="{{ config.display.led_rows }}"><br>

            <label>LED Columns:</label>
            <input type="number" name="led_columns" value="{{ config.display.led_columns }}"><br>

            <label>LED Chain Length:</label>
            <input type="number" name="led_chain_length" value="{{ config.display.led_chain_length }}"><br>

            <label>LED Parallel:</label>
            <input type="number" name="led_parallel" value="{{ config.display.led_parallel }}"><br>

            <label>LED Hardware Mapping:</label>
            <input type="text" name="led_hardware_mapping" value="{{ config.display.led_hardware_mapping }}"><br>

            <label>LED PWM Slowdown:</label>
            <input type="number" name="led_pwm_slowdown" value="{{ config.display.led_pwm_slowdown if config.display.led_pwm_slowdown is defined else 2 }}"><br>

            <label>Line Direction Max Length:</label>
            <input type="number" name="line_direction_max_length" value="{{ config.display.line_direction_max_length }}"><br>
        </div>

        <div class="section">
            <h2>Feed Settings</h2>
            <label>MTA Routes:</label>
            <select id="mta-routes-select" multiple size="8"></select>
            <input type="hidden" id="mta-routes-input" name="mta_routes" value="{{ config.feed.mta_routes }}">
            <div class="helper">Hold Ctrl/Cmd to select multiple routes.</div>

            <label>MTA Stop:</label>
            <select id="mta-stop-select" name="mta_stop">
                <option value="{{ config.feed.mta_stop }}" selected>{{ config.feed.mta_stop }}</option>
            </select>
            <div class="helper" id="mta-stop-helper">Stops are filtered by selected routes and directions.</div>

            <label>MTA Feed Base URL:</label>
            <input type="text" name="mta_feed_base_url" value="{{ config.feed.mta_feed_base_url }}"><br>
        </div>

        <input type="submit" value="Save Settings">
        <div class="section">
            <h2>Reset to Factory Settings</h2>
            <button id="reset-button" style="background: red; color: white; padding: 10px; border: none;">
                Reset to Defaults
            </button>
        </div>
    </form>
</body>
<script>
    const routeSelect = document.getElementById("mta-routes-select");
    const routeInput = document.getElementById("mta-routes-input");
    const stopSelect = document.getElementById("mta-stop-select");
    const stopHelper = document.getElementById("mta-stop-helper");
    const directionInput = document.querySelector("input[name='mta_directions']");
    const initialRoutes = (routeInput.value || "")
        .split(",")
        .map(value => value.trim().toUpperCase())
        .filter(Boolean);
    const initialStop = "{{ config.feed.mta_stop }}";

    function selectedRoutes() {
        return Array.from(routeSelect.selectedOptions).map(option => option.value);
    }

    function updateHiddenRoutes() {
        routeInput.value = selectedRoutes().join(",");
    }

    function showStopStatus(message) {
        stopHelper.textContent = message;
    }

    function renderStopOptions(stops) {
        const currentSelection = stopSelect.value || initialStop;
        stopSelect.innerHTML = "";
        if (!stops.length) {
            const option = document.createElement("option");
            option.value = "";
            option.textContent = "No compatible stops found";
            stopSelect.appendChild(option);
            showStopStatus("No compatible stops found for the selected routes/directions.");
            return;
        }

        stops.forEach(stop => {
            const option = document.createElement("option");
            option.value = stop.stop_name;
            option.textContent = `${stop.stop_name} (${stop.route_ids.join(",")})`;
            if (stop.stop_name === currentSelection) {
                option.selected = true;
            }
            stopSelect.appendChild(option);
        });

        if (!Array.from(stopSelect.options).some(option => option.selected)) {
            stopSelect.options[0].selected = true;
        }
        showStopStatus(`Showing ${stops.length} compatible stops.`);
    }

    function loadStops() {
        updateHiddenRoutes();
        const routes = selectedRoutes();
        const directions = (directionInput.value || "").trim();
        const query = new URLSearchParams();
        if (routes.length) {
            query.set("routes", routes.join(","));
        }
        query.set("directions", directions);
        fetch(`/api/discovery/stops?${query.toString()}`)
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) {
                    showStopStatus(data.message || "Authenticate to load stop choices.");
                    return;
                }
                renderStopOptions(data.stops || []);
            })
            .catch(() => {
                showStopStatus("Failed to load stops.");
            });
    }

    function loadRoutesAndStops() {
        fetch("/api/discovery/routes")
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) {
                    showStopStatus(data.message || "Authenticate to load route choices.");
                    return;
                }
                routeSelect.innerHTML = "";
                (data.routes || []).forEach(route => {
                    const option = document.createElement("option");
                    option.value = route.route_id;
                    option.textContent = `${route.route_id} - ${route.route_long_name || route.route_short_name || ""}`;
                    if (initialRoutes.includes(route.route_id)) {
                        option.selected = true;
                    }
                    routeSelect.appendChild(option);
                });
                if (!selectedRoutes().length && routeSelect.options.length > 0) {
                    routeSelect.options[0].selected = true;
                }
                loadStops();
            })
            .catch(() => {
                showStopStatus("Failed to load routes.");
            });
    }

    routeSelect.addEventListener("change", loadStops);
    directionInput.addEventListener("change", loadStops);
    directionInput.addEventListener("input", loadStops);

    document.getElementById("auth-button").onclick = function() {
        const pin = document.getElementById("setup-pin").value;
        fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pin })
        })
        .then(response => response.json().then(data => ({ ok: response.ok, data })))
        .then(({ ok, data }) => {
            alert(data.message || (ok ? "Authenticated." : "Authentication failed."));
            if (ok) {
                loadRoutesAndStops();
            }
        });
    };
</script>
<script>
    document.querySelector("form").onsubmit = function(event) {
        event.preventDefault(); 
        updateHiddenRoutes();
        fetch("/", {
            method: "POST",
            body: new FormData(document.querySelector("form"))
        })
        .then(response => response.json().then(data => ({ ok: response.ok, data })))
        .then(({ ok, data }) => {
            alert(data.message); 
            if (!ok) {
                return;
            }
            setTimeout(() => {
                location.reload(); 
            }, 3000);
        });
    };
    loadRoutesAndStops();
</script>
<script>
    document.getElementById("reset-button").onclick = function() {
        if (confirm("Are you sure? This will reset all settings to factory defaults.")) {
            fetch("/reset", { method: "POST" })
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                alert(data.message);
                if (!ok) {
                    return;
                }
                setTimeout(() => {
                    location.reload();
                }, 3000);
            });
        }
    };
</script>
</html>
